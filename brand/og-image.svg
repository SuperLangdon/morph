<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Morph">
  <!-- Social preview card (rasterize to PNG before use — most crawlers do
       not render SVG OG images). -->
  <defs>
    <linearGradient id="og-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.6" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.12">
    <rect x="120" y="240" width="60" height="150" rx="6"/>
    <rect x="220" y="240" width="60" height="150" rx="30"/>
    <circle cx="350" cy="315" r="42"/>
  </g>
  <text x="470" y="345" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="700" letter-spacing="-3" fill="#FFFFFF">Morph</text>
  <text x="124" y="490" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="500" fill="#FFFFFF" fill-opacity="0.85">Open-source CMS and static site publishing</text>
</svg>
