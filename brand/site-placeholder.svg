<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Morph site">
  <!-- Dashboard site-card placeholder thumbnail. -->
  <defs>
    <linearGradient id="placeholder-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="placeholder-mark" gradientUnits="userSpaceOnUse" x1="200" y1="175" x2="280" y2="125">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#placeholder-bg)"/>
  <g fill="url(#placeholder-mark)" fill-opacity="0.4">
    <rect x="202" y="126" width="14" height="48" rx="2.5"/>
    <rect x="233" y="126" width="14" height="48" rx="7"/>
    <circle cx="270" cy="150" r="12"/>
  </g>
  <g fill="#0F172A" fill-opacity="0.08">
    <rect x="168" y="208" width="144" height="10" rx="5"/>
    <rect x="192" y="228" width="96" height="10" rx="5"/>
  </g>
</svg>
