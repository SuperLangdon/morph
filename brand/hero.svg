<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Morph">
  <!-- Default published-site hero: diagonal gradient field with an abstract
       square→circle morph sequence. Replaces the upstream hero PNG. -->
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="hero-shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#hero-bg)"/>

  <!-- Morph sequence, left to right: sharp square to full circle -->
  <g fill="url(#hero-shape)">
    <rect x="190" y="300" width="300" height="300" rx="16"/>
    <rect x="560" y="330" width="240" height="240" rx="70"/>
    <rect x="880" y="350" width="200" height="200" rx="100"/>
    <circle cx="1230" cy="450" r="90"/>
    <circle cx="1420" cy="450" r="34"/>
  </g>

  <!-- Echo shapes -->
  <g fill="#FFFFFF" fill-opacity="0.10">
    <circle cx="320" cy="160" r="90"/>
    <rect x="1200" y="640" width="200" height="200" rx="24"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.16">
    <circle cx="1300" cy="180" r="12"/>
    <circle cx="1350" cy="210" r="7"/>
    <circle cx="520" cy="740" r="10"/>
    <rect x="700" y="120" width="24" height="24" rx="6"/>
    <rect x="180" y="680" width="30" height="30" rx="15"/>
  </g>
</svg>
